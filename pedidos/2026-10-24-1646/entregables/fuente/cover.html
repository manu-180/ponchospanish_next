<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spanish for Confident Teens — cover</title>
<style>
  @font-face { font-family:'Anton'; src:url('fonts/anton.woff2') format('woff2'); font-weight:400; }
  @font-face { font-family:'Caveat'; src:url('fonts/caveat700.woff2') format('woff2'); font-weight:700; }
  @font-face { font-family:'Yellowtail'; src:url('fonts/yellowtail.woff2') format('woff2'); font-weight:400; }
  @font-face { font-family:'Montserrat'; src:url('fonts/montserrat-600.woff2') format('woff2'); font-weight:600; }

  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; }
  body { background:#191A12; font-family:'Montserrat',sans-serif; }

  .stage { position:relative; width:1280px; height:720px; }
  .stage::before { content:""; position:absolute; inset:0;
    background:radial-gradient(120% 90% at 50% 38%, rgba(232,168,76,.07) 0%, rgba(25,26,18,0) 62%); }

  /* laptop */
  .laptop { position:absolute; left:50%; top:46px; transform:translateX(-50%); }
  .lid { width:928px; padding:13px 13px 15px; border-radius:16px;
    background:linear-gradient(170deg,#4a4c4e 0%,#303234 16%,#232527 55%,#3a3c3e 100%);
    box-shadow:0 26px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14); }
  .screen { position:relative; width:902px; height:507px; border-radius:5px; overflow:hidden;
    background:#0E0F0A; box-shadow:inset 0 0 0 1px rgba(0,0,0,.6); }
  .cam { position:absolute; left:50%; top:5px; transform:translateX(-50%); width:5px; height:5px;
    border-radius:50%; background:#15171a; box-shadow:0 0 0 1px rgba(255,255,255,.05); }

  .base { position:relative; width:1072px; margin:0 auto; height:17px;
    background:linear-gradient(180deg,#3b3d41 0%,#2a2c30 42%,#17191c 100%);
    border-radius:0 0 11px 11px;
    box-shadow:0 18px 34px rgba(0,0,0,.5); }
  .base::before { content:""; position:absolute; left:50%; top:0; transform:translateX(-50%);
    width:118px; height:7px; background:#26282b; border-radius:0 0 7px 7px; }
  .foot { width:1072px; margin:0 auto; height:7px; border-radius:0 0 16px 16px;
    background:linear-gradient(180deg,#141518,#0d0e10); opacity:.9; }

  /* screen content */
  .photo { position:absolute; left:50%; top:6px; transform:translateX(-50%);
    width:548px; height:300px; overflow:hidden;
    background-image:url('photo.jpg'); background-size:cover; background-position:50% 17%;
    -webkit-mask-image:radial-gradient(ellipse 60% 66% at 50% 42%, #000 50%, rgba(0,0,0,.92) 66%, rgba(0,0,0,.35) 86%, transparent 100%); }
  .photo::before { content:""; position:absolute; inset:0; z-index:1;
    background:linear-gradient(to bottom, rgba(14,15,10,.72) 0%, rgba(14,15,10,.42) 20%, rgba(14,15,10,.12) 38%, rgba(14,15,10,0) 55%); }
  .photo::after { content:""; position:absolute; inset:0; z-index:2;
    background:linear-gradient(to bottom, rgba(14,15,10,0) 58%, rgba(14,15,10,.5) 82%, #0E0F0A 100%); }
  .body { position:absolute; left:0; right:0; bottom:16px; text-align:center; }

  h1 { font-family:'Anton',sans-serif; font-weight:400; color:#E1DDD2; font-size:128px;
    line-height:.86; letter-spacing:.012em; text-shadow:0 6px 26px rgba(0,0,0,.6); }
  h2 { font-family:'Anton',sans-serif; font-weight:400; color:#EDEAE1; font-size:70px;
    line-height:.96; letter-spacing:.004em; margin-top:2px; text-shadow:0 4px 18px rgba(0,0,0,.5); }
  .sub { font-family:'Caveat',cursive; font-weight:700; color:#E8A84C; font-size:33px;
    line-height:1.1; margin-top:9px; letter-spacing:.004em; white-space:nowrap; }
</style>
</head>
<body>
  <div class="stage">
    <div class="laptop">
      <div class="lid">
        <div class="screen">
          <div class="cam"></div>
          <div class="photo"></div>
          <div class="body">
            <h1>SPANISH</h1>
            <h2>for Confident TEENS</h2>
            <div class="sub">A Self-Paced Spanish Programme for the Early Years of Secondary School</div>
          </div>
        </div>
      </div>
      <div class="base"></div>
      <div class="foot"></div>
    </div>
  </div>
</body>
</html>
