            - paragraph [ref=e28]: A Self-Paced Beginner Programme Designed for Modern Families - INCLUDES WORKBOOK!
            - paragraph [ref=e29]: "Spanish for Confident Kids isn’t about turning language learning into another stressful after-school activity or adding pressure to your home education journey. It’s a softer approach to learning Spanish designed for families who want steady progress, real confidence, and a supportive way to begin. This self-paced 10-week beginner course for ages 7–11 helps children build practical Spanish naturally through simple lessons, gentle repetition, and engaging activities they can complete from home, at their own rhythm. Inside, your child will learn everyday Spanish through real-life themes including: — Numbers 1–100 — Colours — Days & Months — Family — Physical Description — Feelings — Weather — Hobbies — Food & Drinks + Includes: → 10-week parent-friendly schedule → Digital or printable workbook with a final mini project designed to help children apply what they’ve learned in a fun, achievable way. This course is for families who are: • tired of rigid learning methods • looking for a more relaxed introduction to Spanish • home education/homeschooling or supplementing school learning • raising globally-minded children • wanting screen-time that actually feels meaningful • prioritising confidence before perfection Created for modern families who want meaningful learning at home! Start anytime, learn at your own pace, and revisit lessons whenever you need."
